<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 상세</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    background: #0e1620;
    color: #fff;
    width: 100%;
    box-sizing: border-box;
    padding-top: 56px;
    padding-bottom: 80px;
    min-height: 100vh;
  }

  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    max-width: 480px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a2534;
    border-bottom: 1px solid #2d3e52;
    padding: 0;
    display: flex;
    height: 56px;
    align-items: center;
    z-index: 100;
  }
  .navbar a {
    flex: 1;
    text-align: center;
    padding: 16px 0;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 3px solid transparent;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .navbar a.active {
    color: #5edb5a;
    border-bottom-color: #5edb5a;
  }
  .navbar a:not(.active) {
    color: #a8b5c5;
  }
  .navbar a:not(.active):hover {
    color: #e8eef5;
  }

  .footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 480px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a2534;
    border-top: 1px solid #2d3e52;
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    z-index: 100;
  }
  .footer .btn-footer {
    flex: 1;
    padding: 14px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: block;
    text-align: center;
  }
  .footer .btn-negative {
    background: transparent;
    color: #2b7ae8;
    border: 2px solid #2b7ae8;
  }
  .footer .btn-negative:hover {
    background: rgba(43, 122, 232, 0.1);
  }
  .footer .btn-positive {
    background: #5edb5a;
    color: #000;
  }
  .footer .btn-positive:hover {
    background: #6fec69;
  }

  .content { padding: 20px; }

  .container { width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box; }

  .main-price {
    text-align: center;
    margin-bottom: 40px;
  }
  .price-label {
    font-size: 14px;
    color: #a8b5c5;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .price-value {
    font-size: 48px;
    font-weight: 700;
    color: #5edb5a;
  }

  .info-grid {
    margin-bottom: 24px;
  }

  .info-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 14px 0;
    border-bottom: 1px solid #2d3e52;
  }
  .info-box:last-child {
    border-bottom: none;
  }

  .info-box-label {
    font-size: 12px;
    color: #7a8998;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0;
    min-width: 100px;
  }
  .info-box-value {
    font-size: 16px;
    font-weight: 600;
    color: #e8eef5;
    text-align: right;
  }

  .info-box-large {
    /* 세로 리스트에서는 불필요 */
  }
  .info-box-large .info-box-value {
    font-size: 16px;
  }

  .timeline {
    background: #1a2534;
    border: 1px solid #2d3e52;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .timeline-label {
    font-size: 12px;
    color: #7a8998;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .timeline-value {
    font-size: 16px;
    color: #e8eef5;
    font-weight: 600;
  }


  .error {
    text-align: center;
    color: #ff6b6b;
    margin: 40px 20px;
    font-size: 16px;
  }
  .loading {
    text-align: center;
    color: #a8b5c5;
    margin: 40px 20px;
    font-size: 16px;
  }
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="navbar">
    <a href="index.html">주문 등록</a>
    <a href="list.html" class="active">판매 현황</a>
  </div>

  <div class="content">
    <div class="container">
      <div id="detail" class="loading">로드 중...</div>
    </div>
  </div>

  <div class="footer" id="footer"></div>

<script>
function formatPrice(price) {
  return price.toLocaleString('ko-KR') + '원';
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('detail').innerHTML = '<div class="error">주문 번호가 없습니다</div>';
    return;
  }

  try {
    const res = await fetch(`/api/list?id=${id}`);
    if (!res.ok) throw new Error('조회 실패');

    const data = await res.json();
    const date = new Date(data.purchased_at);
    const timeStr = date.toLocaleString('ko-KR');

    document.getElementById('detail').innerHTML = `
      <div class="main-price">
        <div class="price-label">결제 금액</div>
        <div class="price-value">${formatPrice(data.total_price)}</div>
      </div>

      <div class="info-grid">
        <div class="info-box">
          <div class="info-box-label">구매자</div>
          <div class="info-box-value">${data.buyer_name}</div>
        </div>
        <div class="info-box">
          <div class="info-box-label">상품</div>
          <div class="info-box-value">${data.product}</div>
        </div>
        <div class="info-box">
          <div class="info-box-label">수량</div>
          <div class="info-box-value">${data.quantity}잔</div>
        </div>
        <div class="info-box">
          <div class="info-box-label">단가</div>
          <div class="info-box-value">${formatPrice(data.price_per_unit)}</div>
        </div>
      </div>

      <div class="timeline">
        <div class="timeline-label">구매 시각</div>
        <div class="timeline-value">${timeStr}</div>
      </div>
    `;

    document.getElementById('footer').innerHTML = `
      <a href="list.html" class="btn-footer btn-negative">목록 보기</a>
      <a href="index.html" class="btn-footer btn-positive">새 주문</a>
    `;
  } catch (e) {
    document.getElementById('detail').innerHTML = `<div class="error">오류: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
