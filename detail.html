<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 상세</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    background: #0e1620;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .header {
    background: linear-gradient(135deg, #5edb5a 0%, #4ec64e 100%);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .header-back {
    font-size: 24px;
    cursor: pointer;
    opacity: 0.9;
    transition: opacity 0.2s;
  }
  .header-back:hover { opacity: 1; }
  .header-title {
    font-size: 20px;
    font-weight: 700;
    flex: 1;
  }
  .header-icon {
    font-size: 24px;
    opacity: 0.8;
  }

  .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }

  .main-price {
    text-align: center;
    margin-bottom: 40px;
  }
  .price-label {
    font-size: 14px;
    color: #a8b5c5;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .price-value {
    font-size: 48px;
    font-weight: 700;
    color: #5edb5a;
  }

  .info-grid {
    margin-bottom: 24px;
  }

  .info-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 14px 0;
    border-bottom: 1px solid #2d3e52;
  }
  .info-box:last-child {
    border-bottom: none;
  }

  .info-box-label {
    font-size: 12px;
    color: #7a8998;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0;
    min-width: 100px;
  }
  .info-box-value {
    font-size: 16px;
    font-weight: 600;
    color: #e8eef5;
    text-align: right;
  }

  .info-box-large {
    /* 세로 리스트에서는 불필요 */
  }
  .info-box-large .info-box-value {
    font-size: 16px;
  }

  .timeline {
    background: #1a2534;
    border: 1px solid #2d3e52;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .timeline-label {
    font-size: 12px;
    color: #7a8998;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .timeline-value {
    font-size: 16px;
    color: #e8eef5;
    font-weight: 600;
  }

  .button-group {
    display: flex;
    gap: 12px;
  }
  .btn {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: block;
    text-align: center;
  }
  .btn-primary {
    background: #5edb5a;
    color: #000;
  }
  .btn-primary:hover {
    background: #6fec69;
    transform: translateY(-2px);
  }
  .btn-secondary {
    background: #2b7ae8;
    color: #fff;
  }
  .btn-secondary:hover {
    background: #3a88f5;
    transform: translateY(-2px);
  }

  .error {
    text-align: center;
    color: #ff6b6b;
    margin: 40px 20px;
    font-size: 16px;
  }
  .loading {
    text-align: center;
    color: #a8b5c5;
    margin: 40px 20px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-back" onclick="window.location.href='list.html'">←</div>
    <div class="header-title" id="header-title">주문 상세</div>
    <div class="header-icon">☕</div>
  </div>

  <div class="container">
    <div id="detail" class="loading">로드 중...</div>
  </div>

<script>
function formatPrice(price) {
  const parts = [];
  const man = Math.floor(price / 10000);
  const cheon = Math.floor((price % 10000) / 1000);
  const baek = Math.floor((price % 1000) / 100);

  if (man > 0) parts.push(man + '만');
  if (cheon > 0) parts.push(cheon + '천');
  if (baek > 0) parts.push(baek + '백');

  return parts.join(' ') + '원';
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('detail').innerHTML = '<div class="error">주문 번호가 없습니다</div>';
    return;
  }

  try {
    const res = await fetch(`/api/list?id=${id}`);
    if (!res.ok) throw new Error('조회 실패');

    const data = await res.json();
    const date = new Date(data.purchased_at);
    const timeStr = date.toLocaleString('ko-KR');

    document.getElementById('header-title').textContent = `#${data.id}`;

    document.getElementById('detail').innerHTML = `
      <div class="main-price">
        <div class="price-label">결제 금액</div>
        <div class="price-value">${formatPrice(data.total_price)}</div>
      </div>

      <div class="info-grid">
        <div class="info-box">
          <div class="info-box-label">구매자</div>
          <div class="info-box-value">${data.buyer_name}</div>
        </div>
        <div class="info-box">
          <div class="info-box-label">상품</div>
          <div class="info-box-value">${data.product}</div>
        </div>
        <div class="info-box">
          <div class="info-box-label">수량</div>
          <div class="info-box-value">${data.quantity}잔</div>
        </div>
        <div class="info-box">
          <div class="info-box-label">단가</div>
          <div class="info-box-value">${formatPrice(data.price_per_unit)}</div>
        </div>
      </div>

      <div class="timeline">
        <div class="timeline-label">구매 시각</div>
        <div class="timeline-value">${timeStr}</div>
      </div>

      <div class="button-group">
        <a href="list.html" class="btn btn-primary">목록 보기</a>
        <a href="index.html" class="btn btn-secondary">새 주문</a>
      </div>
    `;
  } catch (e) {
    document.getElementById('detail').innerHTML = `<div class="error">오류: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
