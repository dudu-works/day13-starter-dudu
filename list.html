<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    background: #0e1620;
    color: #fff;
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .header { margin-bottom: 32px; }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .meta {
    color: #a8b5c5;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .meta-left { display: flex; gap: 12px; }
  a { color: #5edb5a; text-decoration: none; font-weight: 600; }
  a:hover { color: #6fec69; }

  .cards { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: #1a2534;
    border: 1px solid #2d3e52;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .card:hover {
    background: #212d3e;
    border-color: #5edb5a;
    padding-left: 20px;
    box-shadow: 0 4px 12px rgba(94, 219, 90, 0.1);
  }

  .card-id {
    font-size: 12px;
    color: #5edb5a;
    font-weight: 700;
    letter-spacing: 0.5px;
    width: 40px;
    flex-shrink: 0;
  }

  .card-buyer {
    font-size: 15px;
    font-weight: 700;
    color: #e8eef5;
    width: 195px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-product {
    font-size: 14px;
    color: #a8b5c5;
    width: 130px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-quantity {
    font-size: 13px;
    color: #7a8998;
    width: 50px;
    flex-shrink: 0;
  }

  .card-price {
    font-size: 15px;
    font-weight: 700;
    color: #5edb5a;
    width: 120px;
    flex-shrink: 0;
    text-align: right;
  }

  .card-time {
    font-size: 12px;
    color: #7a8998;
    width: 140px;
    flex-shrink: 0;
    text-align: right;
  }

  .notice {
    background: rgba(94, 219, 90, 0.1);
    border-left: 4px solid #5edb5a;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 24px;
    font-size: 14px;
    color: #a8b5c5;
  }
  .notice strong {
    color: #5edb5a;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>☕ 판매 현황</h1>
      <div class="meta">
        <div class="meta-left">
          <span id="count">로드 중...</span>
        </div>
        <a href="index.html">+ 주문 등록</a>
      </div>
    </div>

    <div class="notice">
      <strong>💡 실습 과제:</strong> 아래 주문을 클릭하면 <strong>detail.html</strong>의 상세 페이지가 열립니다. 여러분도 이 페이지를 만들어 보세요!
    </div>

    <div class="cards" id="rows"></div>
  </div>

<script>
async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('count').textContent = '불러오기 실패';
    return;
  }
  const rows = await res.json();
  document.getElementById('count').textContent = `총 ${rows.length}건`;

  const container = document.getElementById('rows');
  container.innerHTML = rows.map(r => {
    const date = new Date(r.purchased_at);
    const timeStr = date.toLocaleString('ko-KR', {
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
    return `
      <div class="card" data-id="${r.id}">
        <div class="card-id">#${r.id}</div>
        <div class="card-buyer">${r.buyer_name}</div>
        <div class="card-product">${r.product}</div>
        <div class="card-quantity">${r.quantity}잔</div>
        <div class="card-price">${r.total_price.toLocaleString('ko-KR')}원</div>
        <div class="card-time">${timeStr}</div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = `detail.html?id=${card.dataset.id}`;
    });
  });
}
load();
</script>
</body>
</html>
