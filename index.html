<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커피 주문 등록 - Day13</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Apple SD Gothic Neo", Pretendard, sans-serif; color: #e8eef5; background: #0e1620; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box; padding-top: 56px; padding-bottom: 80px; }

  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    max-width: 480px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a2534;
    border-bottom: 1px solid #2d3e52;
    padding: 0;
    display: flex;
    height: 56px;
    align-items: center;
    z-index: 100;
  }
  .navbar a {
    flex: 1;
    text-align: center;
    padding: 16px 0;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 3px solid transparent;
    transition: all 0.2s ease;
  }
  .navbar a.active {
    color: #5edb5a;
    border-bottom-color: #5edb5a;
  }
  .navbar a:not(.active) {
    color: #a8b5c5;
  }
  .navbar a:not(.active):hover {
    color: #e8eef5;
  }

  .footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 480px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a2534;
    border-top: 1px solid #2d3e52;
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    z-index: 100;
  }
  .footer .btn-footer {
    flex: 1;
    padding: 14px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .footer .btn-negative {
    background: transparent;
    color: #2b7ae8;
    border: 2px solid #2b7ae8;
  }
  .footer .btn-negative:hover {
    background: rgba(43, 122, 232, 0.1);
  }
  .footer .btn-positive {
    background: #5edb5a;
    color: #000;
  }
  .footer .btn-positive:hover {
    background: #6fec69;
  }

  .content { padding: 20px 16px; }
  h1 { font-size: 28px; margin: 0 0 8px; font-weight: 700; }
  p.lead { color: #a8b5c5; font-size: 14px; margin: 0 0 24px; }
  .card { background: #1a2534; border: 1px solid #2d3e52; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  label { display: block; margin: 16px 0 6px; font-weight: 700; font-size: 14px; color: #a8b5c5; }
  input, select { width: 100%; padding: 12px; border: 1px solid #2d3e52; border-radius: 8px; font-size: 15px; background: #0e1620; color: #e8eef5; font-family: inherit; }
  input:focus, select:focus { outline: 3px solid rgba(94, 219, 90, 0.3); border-color: #5edb5a; }
  button { display: none; }
  #btn-submit { display: block; }
  #btn-submit { margin-top: 24px; width: 100%; padding: 14px 22px; background: #5edb5a; color: #000; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
  #btn-submit:hover { background: #6fec69; }
  #btn-submit:disabled { opacity: .55; cursor: wait; }
  .msg { margin-top: 14px; font-size: 14px; display: none; padding: 12px 14px; border-radius: 8px; border-left: 4px solid; }
  .msg.ok { display: block; background: rgba(94, 219, 90, 0.1); border-left-color: #5edb5a; color: #5edb5a; }
  .msg.err { display: block; background: rgba(255, 107, 107, 0.1); border-left-color: #ff6b6b; color: #ff6b6b; }
  a { color: #5edb5a; text-decoration: none; font-weight: 600; }
  a:hover { color: #6fec69; }
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="navbar">
    <a href="index.html" class="active">주문 등록</a>
    <a href="list.html">판매 현황</a>
  </div>

  <div class="content">
    <h1>주문 등록</h1>
    <p class="lead">주문 1건을 등록하면 판매 표에 행으로 쌓입니다.</p>
    <div class="card">
      <form id="order-form">
        <label for="buyer_name">구매자 이름</label>
        <input id="buyer_name" name="buyer_name" required placeholder="예: 김하늘">

        <label for="product">메뉴</label>
        <select id="product" name="product" required>
          <option value="아메리카노">아메리카노 (3,000원)</option>
          <option value="카페라떼">카페라떼 (4,000원)</option>
          <option value="율무차">율무차 (3,500원)</option>
          <option value="코코아">코코아 (4,000원)</option>
          <option value="우유">우유 (2,500원)</option>
          <option value="크런치캬라멜크림콜드브루 프라푸치노">크런치캬라멜크림콜드브루 프라푸치노 (6,000원)</option>
        </select>

        <label for="quantity">수량</label>
        <input id="quantity" name="quantity" type="number" min="1" value="1" required>

        <button id="btn-submit" type="submit">주문 등록</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <div class="footer">
    <a href="list.html" class="btn-footer btn-negative">판매 현황</a>
    <button id="btn-footer-submit" class="btn-footer btn-positive" type="button">주문 등록</button>
  </div>

<script>
const form = document.getElementById('order-form');
const submitBtn = document.getElementById('btn-footer-submit');

function handleSubmit(e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  submitBtn.disabled = true;
  msg.className = 'msg';

  fetch('/api/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      buyer_name: document.getElementById('buyer_name').value,
      product: document.getElementById('product').value,
      quantity: document.getElementById('quantity').value,
    }),
  }).then(res => {
    if (res.ok) {
      msg.textContent = '주문이 등록됐습니다 - 판매 현황에서 확인해 보세요';
      msg.className = 'msg ok';
      form.reset();
    } else {
      return res.json().catch(() => ({})).then(body => {
        msg.textContent = '등록에 실패했습니다: ' + (body.error || res.status);
        msg.className = 'msg err';
      });
    }
  }).catch(err => {
    msg.textContent = '연결에 실패했습니다: ' + err.message;
    msg.className = 'msg err';
  }).finally(() => {
    submitBtn.disabled = false;
  });
}

form.addEventListener('submit', handleSubmit);
submitBtn.addEventListener('click', handleSubmit);
</script>
</body>
</html>
